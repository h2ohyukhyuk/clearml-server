# Based on official clearml-server v2.4.0 Docker Compose.
# Server only; training Agent will be configured separately.
services:
  apiserver:
    command:
    - apiserver
    image: clearml/server:2.4.0
    restart: unless-stopped
    volumes:
    - ./logs:/var/log/clearml
    - ./config:/opt/clearml/config
    - ./data/fileserver:/mnt/fileserver
    depends_on:
    - redis
    - mongo
    - elasticsearch
    - fileserver
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
      CLEARML__apiserver__pre_populate__enabled: 'true'
      CLEARML__apiserver__pre_populate__zip_files: /opt/clearml/db-pre-populate
      CLEARML__apiserver__pre_populate__artifacts_path: /mnt/fileserver
      CLEARML__services__async_urls_delete__enabled: 'true'
      CLEARML__services__async_urls_delete__fileserver__url_prefixes: '[http://localhost:8081]'
    ports:
    - 127.0.0.1:8008:8008
    networks:
    - backend
    - frontend
  elasticsearch:
    networks:
    - backend
    environment:
      ES_JAVA_OPTS: "-Xms4g -Xmx4g"
      bootstrap.memory_lock: 'true'
      cluster.name: clearml
      cluster.routing.allocation.node_initial_primaries_recoveries: '500'
      cluster.routing.allocation.disk.watermark.low: 500mb
      cluster.routing.allocation.disk.watermark.high: 500mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
      discovery.type: single-node
      http.compression_level: '7'
      node.name: clearml
      reindex.remote.whitelist: '''*.*'''
      xpack.security.enabled: 'false'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    image: elasticsearch:8.19.9
    mem_limit: 8g
    restart: unless-stopped
    volumes:
    - ./data/elastic_7:/usr/share/elasticsearch/data
  fileserver:
    networks:
    - backend
    - frontend
    command:
    - fileserver
    image: clearml/server:2.4.0
    environment:
      CLEARML__fileserver__delete__allow_batch: 'true'
    restart: unless-stopped
    volumes:
    - ./logs:/var/log/clearml
    - ./data/fileserver:/mnt/fileserver
    - ./config:/opt/clearml/config
    ports:
    - 127.0.0.1:8081:8081
  mongo:
    networks:
    - backend
    image: mongo:8.0.15
    restart: unless-stopped
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
    - ./data/mongo_4/db:/data/db
    - ./data/mongo_4/configdb:/data/configdb
  redis:
    networks:
    - backend
    image: redis:8.2.3
    restart: unless-stopped
    volumes:
    - ./data/redis:/data
  webserver:
    command:
    - webserver
    image: clearml/server:2.4.0
    restart: unless-stopped
    depends_on:
    - apiserver
    ports:
    - 127.0.0.1:8080:80
    networks:
    - backend
    - frontend
  async_delete:
    depends_on:
    - apiserver
    - redis
    - mongo
    - elasticsearch
    - fileserver
    image: clearml/server:2.4.0
    networks:
    - backend
    restart: unless-stopped
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      PYTHONPATH: /opt/clearml/apiserver
      CLEARML__services__async_urls_delete__fileserver__url_prefixes: '[http://localhost:8081]'
    entrypoint:
    - python3
    - -m
    - jobs.async_urls_delete
    - --fileserver-host
    - http://fileserver:8081
    volumes:
    - ./logs:/var/log/clearml
    - ./config:/opt/clearml/config
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
name: clearml-server
